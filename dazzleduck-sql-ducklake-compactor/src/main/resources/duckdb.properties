# Read by io.dazzleduck.sql.commons.ConnectionPool for the shared singleton connection Main.java
# runs the startup script against (to ATTACH the catalog before TableConfigProvider reads its
# table). ConnectionPool.executeOnSingleton has no other hook for connection properties, and
# allow_unsigned_extensions cannot be applied via a `SET` statement once the instance is running
# (see RawConnections.java) -- so this file is the only way the singleton's `LOAD ducklake` sees
# the patched extension's images bake in (DUCKLAKE_PATCH.md) as trusted.
#
# This file is resolved from the classloader, i.e. it is process-global, not connection-scoped.
# Fine for this module, which is a standalone executable -- but if dazzleduck-sql-ducklake-compactor
# were ever pulled in as a dependency of another process (e.g. the main server), this setting would
# leak into that process's own ConnectionPool too.
allow_unsigned_extensions=true
