dazzleduck_sql_compaction {
  # List of DuckLake catalog names (must be attached via startup_script)
  databases = []

  # How often to run minor compaction
  minor_compaction_frequency = 1 minute

  # How often to run major compaction
  major_compaction_frequency = 1 hour

  # Only compact files smaller than this size (supports KB, MB, GB suffixes)
  minor_compaction_max_size = 8MB

  # Only compact files smaller than this size
  major_compaction_max_size = 64MB

  # How often to run housekeeping: expire old snapshots and delete orphaned S3 files.
  # Decoupled from compaction so S3 cleanup happens frequently without forcing a full merge.
  housekeeping_frequency = 5 minutes

  # Snapshots and files older than this are expired and deleted during housekeeping
  snapshot_retention = 15 minutes

  # Port for the embedded health check HTTP server (GET /health)
  health_port = 8080

  # A long compaction/housekeeping cycle can hold a Postgres-backed catalog's metadata transaction
  # open (writing to object storage) past Postgres' idle_in_transaction_session_timeout, killing the
  # connection and failing the commit. When adaptive, on a detected idle-timeout-shaped failure the
  # compactor re-ATTACHes that catalog with a higher connection-scoped timeout (never ALTER DATABASE
  # — this never touches the database-wide default or requires DB ownership). Escalation is
  # in-memory only and resets on restart, since nothing durable changes in Postgres.
  idle_in_transaction_timeout = 2 minutes         # value used on the first escalation
  idle_in_transaction_timeout_max = 30 minutes    # ceiling; doubles on each further escalation
  idle_in_transaction_timeout_adaptive = false    # global opt-in; also needs a postgres_metadata entry

  # Required per catalog, only when idle_in_transaction_timeout_adaptive = true and that catalog is
  # Postgres-backed. `database` must match an entry in `databases` above. `connection_string` is the
  # libpq key=value string used in that catalog's ATTACH, with no `options=` key (the compactor
  # appends its own idle_in_transaction_session_timeout on escalation) and no `postgres:` prefix
  # (also appended automatically). `attach_options` is the verbatim clause that follows
  # `AS <database>` in the original ATTACH statement.
  #
  # IMPORTANT: that original startup-script ATTACH must itself use the `ducklake:postgres:...` DSN
  # form, not the bare `ducklake:host=...` form — without the `postgres:` sub-scheme, DuckLake
  # silently falls back to a local file catalog instead of storing metadata in Postgres, and
  # escalation would then re-ATTACH to a disconnected, empty catalog. Verified empirically.
  #
  # IMPORTANT: `attach_options` must not include `METADATA_PATH ':memory:'` — also verified
  # incompatible with a same-process DETACH/re-ATTACH (which is what escalation does): with it the
  # re-ATTACH loses visibility into the catalog's own tables; the default local metadata cache
  # works correctly.
  postgres_metadata = [
    # {
    #   database = "mylake"
    #   connection_string = "host=... port=5432 dbname=... user=... password=..."
    #   attach_options = "(DATA_PATH 's3://bucket/data', METADATA_PATH ':memory:')"
    # }
  ]

  # Exports this service's meters to an OpenTelemetry collector over OTLP gRPC.
  metrics {
    # Off by default. While false the meters go to the log registry instead, so a compactor
    # deployed without a collector does not log a failed export every interval.
    # Setting this true also requires `token` (see below) — the service fails fast on startup
    # otherwise, since the collector rejects every unauthenticated export.
    enabled = false
    enabled = ${?DD_METRICS_ENABLED}

    # The collector's OTLP gRPC receiver — otel_collector.grpc_port, 4317 by default. Note this
    # is NOT the collector's health port, which defaults to 8081.
    endpoint = "http://localhost:4317"
    endpoint = ${?DD_METRICS_OTLP_ENDPOINT}

    # Matched to the minor compaction frequency — a shorter interval exports unchanged values.
    export_interval = 1 minute

    request_timeout = 10 seconds

    # Required. The collector authenticates every RPC and reads the target queue from the token's
    # x-dd-ingestion-queue claim; there is no fallback, so a token without it is rejected with
    # INVALID_ARGUMENT. The claim must name a queue in ingestion_queue_table_mapping.
    token = ${?DD_METRICS_OTLP_TOKEN}

    # Reported as the service.name resource attribute.
    service_name = "ducklake-compactor"
  }

  # SQL executed once on startup (use to ATTACH databases, load extensions, etc.)
  # Supports any StartupScriptProvider via the 'class' key (default: ConfigBasedStartupScriptProvider).
  startup_script_provider {
    # class = io.dazzleduck.sql.flight.LocalStartupConfigProvider
    # script_location = "/config/startup.sql"
    # content = "ATTACH '...' AS mydb (DATA_PATH '...');"
  }
}
